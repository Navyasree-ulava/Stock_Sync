name: stocksync

services:
  db:
    image: postgres:15-alpine
    container_name: stocksync-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stocksync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stocksync_password}
      POSTGRES_DB: ${POSTGRES_DB:-stocksync}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: stocksync-backend
    restart: unless-stopped
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-stocksync}:${POSTGRES_PASSWORD:-stocksync_password}@db:5432/${POSTGRES_DB:-stocksync}"
      ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://frontend"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Keep browser requests same-origin so Nginx can proxy them.
        VITE_API_URL: ""
    container_name: stocksync-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
    name: stocksync-pgdata
